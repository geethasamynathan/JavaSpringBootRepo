<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

<!-- =======================
     NAVBAR
======================= -->

<nav class="navbar navbar-dark bg-primary shadow-sm">

    <div class="container">

        <span class="navbar-brand mb-0 h1">

            <i class="bi bi-people-fill"></i>

            Employee Management

        </span>

    </div>

</nav>


<!-- =======================
     MAIN CONTAINER
======================= -->

<div class="container py-5">


    <!-- Page Heading -->

    <div class="row mb-4">

        <div class="col-md-8">

            <h2 class="fw-bold">
                Employee Dashboard
            </h2>

            <p class="text-muted">

                Manage employee information using
                Spring Boot, JPA and MySQL.

            </p>

        </div>


        <div class="col-md-4 text-md-end">

            <button
                    class="btn btn-primary btn-lg"
                    data-bs-toggle="modal"
                    data-bs-target="#employeeModal"
                    onclick="openAddEmployeeModal()">

                <i class="bi bi-person-plus-fill"></i>

                Add Employee

            </button>

        </div>

    </div>


    <!-- =======================
         DASHBOARD CARDS
    ======================= -->

    <div class="row g-3 mb-4">


        <div class="col-md-4">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>

                            <p class="text-muted mb-1">
                                Total Employees
                            </p>

                            <h2 id="totalEmployees">
                                0
                            </h2>

                        </div>

                        <div class="dashboard-icon bg-primary">

                            <i class="bi bi-people"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>

                            <p class="text-muted mb-1">
                                Permanent Employees
                            </p>

                            <h2 id="permanentEmployees">
                                0
                            </h2>

                        </div>

                        <div class="dashboard-icon bg-success">

                            <i class="bi bi-person-check-fill"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>

                            <p class="text-muted mb-1">
                                Departments
                            </p>

                            <h2 id="totalDepartments">
                                0
                            </h2>

                        </div>

                        <div class="dashboard-icon bg-warning">

                            <i class="bi bi-building"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>


    </div>


    <!-- =======================
         EMPLOYEE TABLE CARD
    ======================= -->

    <div class="card shadow-sm">

        <div class="card-header bg-white py-3">

            <div class="row align-items-center">


                <div class="col-md-6">

                    <h5 class="mb-0 fw-bold">

                        <i class="bi bi-table"></i>

                        Employee List

                    </h5>

                </div>


                <div class="col-md-6">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Search employee..."
                                onkeyup="searchEmployees()">

                    </div>

                </div>


            </div>

        </div>


        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Salary</th>

                        <th>Department</th>

                        <th>Permanent</th>

                        <th class="text-center">
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody id="employeeTableBody">

                    <!-- JavaScript inserts employees -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>



<!-- =======================
     EMPLOYEE MODAL
======================= -->

<div
        class="modal fade"
        id="employeeModal"
        tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <div class="modal-header">

                <h5
                        class="modal-title"
                        id="modalTitle">

                    Add Employee

                </h5>


                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">


                <form id="employeeForm">


                    <input
                            type="hidden"
                            id="employeeId">


                    <!-- Employee Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Employee Name
                        </label>

                        <input
                                type="text"
                                id="employeeName"
                                class="form-control"
                                required>

                    </div>


                    <!-- Age -->

                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                                type="number"
                                id="age"
                                class="form-control"
                                min="18"
                                required>

                    </div>


                    <!-- Salary -->

                    <div class="mb-3">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                                type="number"
                                id="salary"
                                class="form-control"
                                required>

                    </div>


                    <!-- Department -->

                    <div class="mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                                id="department"
                                class="form-select"
                                required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Operations">
                                Operations
                            </option>

                        </select>

                    </div>


                    <!-- Permanent Employee -->

                    <div class="form-check form-switch mb-3">

                        <input
                                class="form-check-input"
                                type="checkbox"
                                id="permanentEmployee">

                        <label
                                class="form-check-label"
                                for="permanentEmployee">

                            Permanent Employee

                        </label>

                    </div>


                </form>


            </div>


            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                        type="button"
                        class="btn btn-primary"
                        onclick="saveEmployee()">

                    <i class="bi bi-save"></i>

                    Save Employee

                </button>

            </div>


        </div>

    </div>

</div>



<!-- =======================
     TOAST MESSAGE
======================= -->

<div
        class="toast-container position-fixed bottom-0 end-0 p-3">


    <div
            id="messageToast"
            class="toast">

        <div class="toast-header">

            <strong class="me-auto">
                Employee Management
            </strong>

            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">
            </button>

        </div>


        <div
                class="toast-body"
                id="toastMessage">

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Our JavaScript -->

<script src="js/app.js"></script>


</body>
</html>
